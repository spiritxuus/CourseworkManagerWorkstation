# RentalContract
sql.rentalContract_insert=SELECT my_schema.f_create_rental_contract(CAST(? AS integer), CAST(? AS date), CAST(? AS date), CAST(? AS date), CAST(? AS numeric), CAST(? AS numeric), CAST(? AS smallint), CAST(? AS text), CAST(? AS text))
sql.rentalContract_selectById=SELECT contract_id, reservation_id, client_id, issue_date, planned_return_date, actual_return_date, deposit_amount, total_amount, status, issue_condition_desc, issue_condition_photo FROM my_schema.rental_contract WHERE contract_id = ?
sql.rentalContract_select=SELECT contract_id, reservation_id, client_id, issue_date, planned_return_date, actual_return_date, deposit_amount, total_amount, status, issue_condition_desc, issue_condition_photo FROM my_schema.rental_contract
sql.rentalContract_update=UPDATE my_schema.rental_contract SET reservation_id = ?, client_id = ?, issue_date = ?, planned_return_date = ?, actual_return_date = ?, deposit_amount = ?, total_amount = ?, status = ?, issue_condition_desc = ?, issue_condition_photo = ? WHERE contract_id = ?
sql.rentalContract_delete=DELETE FROM my_schema.rental_contract WHERE contract_id = ?
sql.rentalContract_selectViews=SELECT contr.contract_id, r.reservation_id, r.client, c.natural_person_id, c.legal_person_id, CASE WHEN c.natural_person_id IS NOT NULL THEN CONCAT_WS(' ', np.surname, np.name, np.patronymic) ELSE lp.company_name END AS client_name, contr.issue_date, contr.planned_return_date, contr.actual_return_date, contr.deposit_amount, contr.total_amount, contr.status, contr.issue_condition_desc, contr.issue_condition_photo FROM my_schema.rental_contract contr LEFT JOIN my_schema.reservation r ON contr.reservation_id = r.reservation_id LEFT JOIN my_schema.client c ON r.client = c.client_id LEFT JOIN my_schema.natural_person np ON c.natural_person_id = np.natural_person_id LEFT JOIN my_schema.legal_person lp ON c.legal_person_id = lp.legal_person_id

