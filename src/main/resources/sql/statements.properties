# Reservation
sql.reservation_insert=SELECT my_schema.f_create_reservation(CAST(? AS integer), CAST(? AS integer), CAST(? AS date), CAST(? AS date))
sql.reservation_selectById=SELECT reservation_id, client, equipment, start_date, end_date FROM my_schema.reservation WHERE reservation_id = ?
sql.reservation_select=SELECT reservation_id, client, equipment, start_date, end_date FROM my_schema.reservation
sql.reservation_update=UPDATE my_schema.reservation SET client = ?, equipment = ?, start_date = ?, end_date = ? WHERE reservation_id = ?
sql.reservation_delete=DELETE FROM my_schema.reservation WHERE reservation_id = ?
sql.reservation_selectViews=SELECT r.reservation_id, r.client, c.natural_person_id, c.legal_person_id, CASE WHEN c.natural_person_id IS NOT NULL THEN CONCAT_WS(' ', np.surname, np.name, np.patronymic) ELSE lp.company_name END AS client_name, e.name AS equipment_name, r.start_date, r.end_date FROM my_schema.reservation r LEFT JOIN my_schema.client c ON r.client = c.client_id LEFT JOIN my_schema.equipment e ON r.equipment = e.equipment_id LEFT JOIN my_schema.natural_person np ON c.natural_person_id = np.natural_person_id LEFT JOIN my_schema.legal_person lp ON c.legal_person_id = lp.legal_person_id

# ReturnOfEquipment
sql.returnOfEquipment_insert=INSERT INTO my_schema.return_of_equipment (contract, return_date, condition_desc, condition_photo, damage_amount, deduction_amount, repair_required) VALUES (?, ?, ?, ?, ?, ?, ?)
sql.returnOfEquipment_selectById=SELECT return_id, contract, return_date, condition_desc, condition_photo, damage_amount, deduction_amount, repair_required FROM my_schema.return_of_equipment WHERE return_id = ?
sql.returnOfEquipment_select=SELECT return_id, contract, return_date, condition_desc, condition_photo, damage_amount, deduction_amount, repair_required FROM my_schema.return_of_equipment
sql.returnOfEquipment_update=UPDATE my_schema.return_of_equipment SET contract = ?, return_date = ?, condition_desc = ?, condition_photo = ?, damage_amount = ?, deduction_amount = ?, repair_required = ? WHERE return_id = ?
sql.returnOfEquipment_delete=DELETE FROM my_schema.return_of_equipment WHERE return_id = ?
sql.returnOfEquipment_selectContractViews=SELECT contract.contract_id, contract.reservation_id, CASE WHEN client.natural_person_id IS NOT NULL THEN CONCAT_WS(' ', np.surname, np.name) ELSE lp.company_name END AS client_name, contract.issue_date FROM my_schema.rental_contract contract LEFT JOIN my_schema.reservation r ON contract.reservation_id = r.reservation_id LEFT JOIN my_schema.client client ON r.client = client.client_id LEFT JOIN my_schema.natural_person np ON client.natural_person_id = np.natural_person_id LEFT JOIN my_schema.legal_person lp ON client.legal_person_id = lp.legal_person_id
sql.returnOfEquipment_selectViews=SELECT ret.return_id, contract.contract_id, CASE WHEN client.natural_person_id IS NOT NULL THEN CONCAT_WS(' ', np.surname, np.name) ELSE lp.company_name END AS client_name, equip.name AS equipment_name, ret.return_date, ret.condition_desc, ret.condition_photo, ret.damage_amount, ret.deduction_amount, ret.repair_required FROM my_schema.return_of_equipment ret LEFT JOIN my_schema.rental_contract contract ON contract.contract_id = ret.contract LEFT JOIN my_schema.reservation r ON contract.reservation_id = r.reservation_id LEFT JOIN my_schema.equipment equip ON r.equipment = equip.equipment_id LEFT JOIN my_schema.client client ON r.client = client.client_id LEFT JOIN my_schema.natural_person np ON client.natural_person_id = np.natural_person_id LEFT JOIN my_schema.legal_person lp ON client.legal_person_id = lp.legal_person_id