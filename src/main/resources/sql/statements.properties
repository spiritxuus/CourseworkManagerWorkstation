# Address
sql.address_insert=INSERT INTO my_schema.address (country, region, city, street, house, apartment) VALUES (?, ?, ?, ?, ?, ?)
sql.address_selectById=SELECT address_id, country, region, city, street, house, apartment FROM my_schema.address WHERE address_id = ?
sql.address_select=SELECT address_id, country, region, city, street, house, apartment FROM my_schema.address
sql.address_update=UPDATE my_schema.address SET country = ?, region = ?, city = ?, street = ?, house = ?, apartment = ? WHERE address_id = ?
sql.address_delete=DELETE FROM my_schema.address WHERE address_id = ?
sql.address_selectViews=SELECT address_id, country, region, city, street, house, apartment FROM my_schema.address ORDER BY country, region, city, street, house, apartment

# Client
sql.client_insert=INSERT INTO my_schema.client (natural_person_id, legal_person_id) VALUES (?, ?)
sql.client_selectById=SELECT client_id, natural_person_id, legal_person_id FROM my_schema.client WHERE client_id = ?
sql.client_select=SELECT client_id, natural_person_id, legal_person_id FROM my_schema.client
sql.client_update=UPDATE my_schema.client SET natural_person_id = ?, legal_person_id = ? WHERE client_id = ?
sql.client_delete=DELETE FROM my_schema.client WHERE client_id = ?
sql.client_selectViews=SELECT c.client_id, c.natural_person_id, c.legal_person_id, CASE WHEN c.natural_person_id IS NOT NULL THEN '\u0424\u0438\u0437\u0438\u0447\u0435\u0441\u043A\u043E\u0435 \u043B\u0438\u0446\u043E' ELSE '\u042E\u0440\u0438\u0434\u0438\u0447\u0435\u0441\u043A\u043E\u0435 \u043B\u0438\u0446\u043E' END AS client_type, CASE WHEN c.natural_person_id IS NOT NULL THEN CONCAT_WS(' ', np.surname, np.name, np.patronymic) ELSE lp.company_name END AS client_name, COALESCE(np.phone, lp.phone) AS client_phone, COALESCE(np.email, lp.email) AS client_email, CONCAT_WS(', ', a.country, a.region, a.city, a.street, a.house, a.apartment) AS client_address FROM my_schema.client c LEFT JOIN my_schema.natural_person np ON c.natural_person_id = np.natural_person_id LEFT JOIN my_schema.legal_person lp ON c.legal_person_id = lp.legal_person_id LEFT JOIN my_schema.address a ON a.address_id = COALESCE(np.address, lp.address)

