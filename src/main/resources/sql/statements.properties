sql.equipment_insert=INSERT INTO my_schema.equipment (category, name, manufacturer, model, inventory_number, serial_number, rental_price_per_day, deposit_amount, condition_status, requires_repair, photo, description) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
