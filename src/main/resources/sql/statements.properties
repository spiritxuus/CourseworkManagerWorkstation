sql.equipment_select=SELECT equipment_id, category, name, manufacturer, model, inventory_number, serial_number, rental_price_per_day, deposit_amount, condition_status, requires_repair, photo, description FROM my_schema.equipment
sql.equipment_update=UPDATE my_schema.equipment SET category = ?, name = ?, manufacturer = ?, model = ?, inventory_number = ?, serial_number = ?, rental_price_per_day = ?, deposit_amount = ?, condition_status = ?, requires_repair = ?, photo = ?, description = ? WHERE equipment_id = ?
sql.equipment_delete=DELETE FROM my_schema.equipment WHERE equipment_id = ?
sql.equipment_selectCategoryViews=SELECT category_id, category_name FROM my_schema.equipment_category ORDER BY category_name

