sql.naturalPerson_insert=INSERT INTO my_schema.natural_person (name, surname, patronymic, birth_date, gender, passport_series, passport_number, phone, email, address) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
sql.naturalPerson_selectById=SELECT natural_person_id, name, surname, patronymic, birth_date, gender, passport_series, passport_number, phone, email, address FROM my_schema.natural_person WHERE natural_person_id = ?
